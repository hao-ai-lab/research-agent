<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Agent v2</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0f;
            --bg-surface: #12121a;
            --bg-elevated: #1a1a26;
            --border: #2a2a3a;
            --text: #e4e4ef;
            --text-dim: #8888a0;
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --success: #00d2a0;
            --error: #ff6b6b;
            --tool-bg: #161622;
            --radius: 12px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-surface);
        }
        .header h1 {
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent), #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .status {
            font-size: 12px;
            color: var(--text-dim);
            margin-left: auto;
        }
        .header .status.connected { color: var(--success); }

        /* Chat area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.6;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .message.assistant pre {
            background: var(--bg);
            padding: 10px 14px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }
        .message.assistant code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .tool-event {
            align-self: flex-start;
            font-size: 12px;
            color: var(--text-dim);
            padding: 6px 12px;
            background: var(--tool-bg);
            border-radius: 8px;
            border-left: 2px solid var(--accent);
            font-family: 'JetBrains Mono', monospace;
        }
        .tool-event.tool-end { border-left-color: var(--success); }

        /* Input area */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            background: var(--bg-surface);
            display: flex;
            gap: 10px;
        }
        .input-area textarea {
            flex: 1;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
            padding: 12px 16px;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
            transition: border-color 0.2s;
        }
        .input-area textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }
        .input-area button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 0 20px;
            font-family: var(--font);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .input-area button:hover { opacity: 0.9; }
        .input-area button:active { transform: scale(0.97); }
        .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-dim);
        }
        .empty-state .icon { font-size: 48px; }
        .empty-state p { font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔬 Research Agent v2</h1>
        <span class="status" id="status">Disconnected</span>
    </div>

    <div class="chat-area" id="chat">
        <div class="empty-state" id="empty">
            <div class="icon">🧪</div>
            <p>Ask the agent anything — it can run code, read files, and manage experiments.</p>
        </div>
    </div>

    <div class="input-area">
        <textarea id="input" placeholder="Ask the research agent…" rows="1"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatEl = document.getElementById('chat')
        const inputEl = document.getElementById('input')
        const sendBtn = document.getElementById('sendBtn')
        const statusEl = document.getElementById('status')
        const emptyEl = document.getElementById('empty')
        let sending = false

        // Auto-resize textarea
        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto'
            inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px'
        })

        function addMessage(role, content) {
            if (emptyEl) emptyEl.remove()
            const div = document.createElement('div')
            div.className = `message ${role}`
            div.innerHTML = formatContent(content)
            chatEl.appendChild(div)
            chatEl.scrollTop = chatEl.scrollHeight
            return div
        }

        function addToolEvent(type, name, result) {
            if (emptyEl) emptyEl.remove()
            const div = document.createElement('div')
            div.className = `tool-event ${type}`
            if (type === 'tool-start') {
                div.textContent = `⚡ ${name}`
            } else {
                div.textContent = `✓ ${name}: ${(result || '').slice(0, 100)}`
            }
            chatEl.appendChild(div)
            chatEl.scrollTop = chatEl.scrollHeight
        }

        function formatContent(text) {
            // Basic markdown: code blocks, inline code, bold
            return text
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>')
        }

        async function sendMessage() {
            const message = inputEl.value.trim()
            if (!message || sending) return

            sending = true
            sendBtn.disabled = true
            inputEl.value = ''
            inputEl.style.height = 'auto'

            addMessage('user', message)
            const assistantDiv = addMessage('assistant', '')
            statusEl.textContent = 'Streaming…'
            statusEl.className = 'status connected'

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, sessionId: 'default' }),
                })

                const reader = res.body.getReader()
                const decoder = new TextDecoder()
                let buffer = ''
                let fullText = ''

                while (true) {
                    const { done, value } = await reader.read()
                    if (done) break

                    buffer += decoder.decode(value, { stream: true })
                    const lines = buffer.split('\n')
                    buffer = lines.pop()

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue
                        try {
                            const data = JSON.parse(line.slice(6))
                            if (data.type === 'text') {
                                fullText += data.content
                                assistantDiv.innerHTML = formatContent(fullText)
                                chatEl.scrollTop = chatEl.scrollHeight
                            } else if (data.type === 'tool_start') {
                                addToolEvent('tool-start', data.name)
                            } else if (data.type === 'tool_end') {
                                addToolEvent('tool-end', data.name, data.result)
                            } else if (data.type === 'error') {
                                assistantDiv.innerHTML = `<span style="color:var(--error)">Error: ${data.message}</span>`
                            }
                        } catch { }
                    }
                }

                if (!fullText) assistantDiv.innerHTML = '<span style="color:var(--text-dim)">(no response)</span>'
            } catch (err) {
                assistantDiv.innerHTML = `<span style="color:var(--error)">Connection error: ${err.message}</span>`
            }

            sending = false
            sendBtn.disabled = false
            statusEl.textContent = 'Ready'
            inputEl.focus()
        }

        // Initial status check
        fetch('/health').then(r => r.json()).then(d => {
            statusEl.textContent = 'Ready'
            statusEl.className = 'status connected'
        }).catch(() => {
            statusEl.textContent = 'Server offline'
        })
    </script>
</body>
</html>
